app = "vidyagyaan-cbse"
primary_region = "bom"  # Mumbai - closest to India, free tier

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  UVICORN_WORKERS = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
